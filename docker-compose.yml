services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      N8N_WEBHOOK_URL: ${N8N_DOCKER_WEBHOOK_URL:-${N8N_WEBHOOK_URL}}
      CHROMA_DB_PATH: /app/state/chroma_db
      VISIT_DB_PATH: /app/state/visits.db
      CRM_DB_PATH: /app/state/crm_store.db
      VISITS_API_DB_PATH: /app/state/legacy_visits.db
      AUDIO_OUTPUT_DIR: /app/state/audio_output
      APP_LOG_PATH: /app/state/conversation_audit.log
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GOOGLE_TOKEN_PATH: /app/state/google_token.json
      GOOGLE_TOKEN_SECRET_PATH: /run/secrets/google_calendar_token
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uzma_state:/app/state
    secrets:
      - google_calendar_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  google_calendar_token:
    file: ${GOOGLE_TOKEN_FILE:-./token.json}

volumes:
  uzma_state:
